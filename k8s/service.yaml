apiVersion: v1
kind: Service
metadata:
  name: java-app-service
  labels:
    app: java-app
    release: monitoring
spec:
  type: NodePort
  selector:
    app: java-app
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8080
    nodePort: 30007
  - name: metrics
    protocol: TCP
    port: 8080
    targetPort: 8080
